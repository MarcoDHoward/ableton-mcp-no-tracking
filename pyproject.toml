[project]
name = "ableton-mcp"
version = "1.4.5+notrack"
description = "Ableton Live integration through the Model Context Protocol (fork with all telemetry and data collection removed)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
]

[project.scripts]
ableton-mcp = "MCP_Server.server:main"
ableton-mcp-install-script = "MCP_Server.remote_script_install:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["MCP_Server", "MCP_Server.bundled_ableton_remote_script"]

[tool.setuptools.package-data]
"MCP_Server.bundled_ableton_remote_script" = ["AbletonMCP_init.py"]

[project.urls]
"Homepage" = "https://github.com/MarcoDHoward/ableton-mcp-no-tracking"
"Upstream" = "https://github.com/ahujasid/ableton-mcp"
"Bug Tracker" = "https://github.com/MarcoDHoward/ableton-mcp-no-tracking/issues"